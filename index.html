<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta http-equiv="X-UA-Compatible" content="IE=edge"/><meta name="description" content="Spot"/><meta name="keywords" content="HTML.CSS"/><meta name="author" content="Ivan Kwetey"/><link rel="icon" href="favicon.ico" type="image/x-icon"/><title>Spots</title><script defer="defer" src="main.js"></script><link href="main.css" rel="stylesheet"></head><body><div class="page"><header class="header"><img src="8650253b58b46f0f1c06.svg" class="header__logo" alt="Logo"></header><main class="content"><section class="profile"><div class="profile__section"><img src="2fc47fd8e9a9bcd9612f.jpg" alt="avatar" class="profile__photo"/><div class="profile__details"><div class="profile__description"><h1 class="profile__name">Bessie Coleman</h1><h2 class="profile__title">Civil Aviator</h2></div><button class="profile__edit" type="button"><img src="5c2584faa41177b41691.svg" alt="edit icon" class="profile__edit-icon"/> <span class="profile__edit-text">Edit Profile</span></button></div></div><button class="profile__post" type="button"><img src="40608da7369d39bc1077.svg" alt="new post icon" class="profile__post-icon"/> <span class="profile__post-text">New Post</span></button></section><section class="gallery"><ul class="gallery__list"><template id="card-template"><li class="gallery__card"><img src="#" class="gallery__image" alt=""/> <button class="gallery__icon-delete" aria-label="delete" type="button"></button><div class="gallery__info"><h3 class="gallery__text"></h3><button class="gallery__icon" aria-label="Like" type="button"></button></div></li></template></ul></section></main><footer class="footer"><p class="footer__text">2025 &copy; Ivan Kwetey. All rights reserved.</p></footer><div class="modal" id="edit-profile-modal"><div class="modal__container"><div class="modal__header"><h2 class="modal__title">Edit profile</h2><button type="button" class="modal__close-btn" aria-label="Close"></button></div><form class="modal__form" novalidate><label for="profile-name-input" class="modal__label">Name <input class="modal__input" id="profile-name-input" placeholder="Type your name" required minlength="2" maxlength="40"/> <span id="profile-name-input-error" class="modal__error"></span></label> <label for="profile-description-input" class="modal__label">Description <input class="modal__input" id="profile-description-input" placeholder="Describe yourself" required minlength="2" maxlength="200"/> <span id="profile-description-input-error" class="modal__error"></span></label> <button class="modal__submit-btn" type="submit">Save</button></form></div></div><div class="modal" id="new-post-modal"><div class="modal__container"><div class="modal__header"><h2 class="modal__title">New post</h2><button type="button" class="modal__close-btn" aria-label="Close"></button></div><form class="modal__form" novalidate><label for="image-link-input" class="modal__label">Image link <input type="url" class="modal__input" id="image-link-input" placeholder="Paste a link to the picture" required/> <span id="image-link-input-error" class="modal__error"></span></label> <label for="post-caption-input" class="modal__label">Caption <input class="modal__input" id="post-caption-input" placeholder="Type your caption" required maxlength="30" minlength="2"/> <span id="post-caption-input-error" class="modal__error"></span></label> <button class="modal__submit-btn" type="submit">Save</button></form></div></div><div class="modal" id="preview-post-modal"><div class="modal__preview-container"><img src="#" alt="#" class="modal__image"><p class="modal__preview-caption"></p><button type="button" class="modal__close-btn modal__close-btn_type_preview" aria-label="Close"></button></div></div></div></body></html>
