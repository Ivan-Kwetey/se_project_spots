<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="description" content="Spot" />
  <meta name="keywords" content="HTML.CSS" />
  <meta name="author" content="Ivan Kwetey" />
  <link rel="icon" href="favicon.ico" type="image/x-icon" />
  <title>Spots</title>
</head>
<body>
  <div class="page">

    <!-- Header -->
    <header class="header">
        <img src="<%=require('./images/Logo.svg')%>" class="header__logo" alt="Logo">
    </header>

    <!-- Profile Section -->
    <main class="content">
      <section class="profile">
      <div class="profile__section">
        <!-- Avatar & overlay -->
        <div class="profile__add-btn">
          <img src="" alt="avatar" class="profile__photo" />
          <button class="profile__avatar-btn">
            <img src="<%=require('./images/editpencilwhite.svg')%>" class="profile__pencil-icon" alt="pencil icon" />
            Edit Avatar
          </button>
        </div>
        <!-- Profile Details -->
          <div class="profile__details">
            <div class="profile__description">
              <h1 class="profile__name">Bessie Coleman</h1>
              <h2 class="profile__title">Civil Aviator</h2>
            </div>

            <button class="profile__edit" type="button">
              <img src="<%=require('./images/editpen.svg')%>"alt="edit icon" class="profile__edit-icon" />
              <span class="profile__edit-text">Edit Profile</span>
            </button>
          </div>
          </div>


        <button class="profile__post" type="button">
          <img src="<%=require('./images/newpost.svg')%>" alt="new post icon" class="profile__post-icon" />
          <span class="profile__post-text">New Post</span>
        </button>
      </section>

    <!-- Gallery Section -->
      <section class="gallery">
        <ul class="gallery__list">
          <template id="card-template">
            <li class="gallery__card">
              <img src="#" class="gallery__image" alt="" />
              <button class="gallery__icon-delete" aria-label="delete" type="button">
              </button>
            <div class="gallery__info">
              <h3 class="gallery__text">
              </h3>
              <button class="gallery__icon" aria-label="Like" type="button">
              </button>

            </div>
          </li>
          </template>

        </ul>
      </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <p class="footer__text">2025 &copy; Ivan Kwetey. All rights reserved.</p>
    </footer>
    <div class="modal" id="edit-profile-modal">
      <div class="modal__container ">
        <div class="modal__header">
          <h2 class="modal__title">Edit profile</h2>
          <button type="button" class="modal__close-btn" aria-label="Close"></button>
        </div>

        <form class="modal__form" novalidate>
          <label for="profile-name-input" class="modal__label">
            Name
            <input
              type="text"
              class="modal__input"
              id="profile-name-input"
              placeholder="Type your name"
              required
              minlength="2"
              maxlength="40"
            />
            <span id="profile-name-input-error" class="modal__error"></span>
          </label>

          <label for="profile-description-input" class="modal__label">
            Description
            <input
              type="text"
              class="modal__input"
              id="profile-description-input"
              placeholder="Describe yourself"
              required
              minlength="2"
              maxlength="200"
            />
            <span id="profile-description-input-error" class="modal__error"></span>
          </label>

          <button class="modal__submit-btn" type="submit">Save</button>
        </form>
      </div>
    </div>
    <div class="modal" id="new-post-modal">
      <div class="modal__container">
        <div class="modal__header">
          <h2 class="modal__title">New post</h2>
          <button type="button" class="modal__close-btn " aria-label="Close"></button>
        </div>

        <form class="modal__form" novalidate>
          <label for="image-link-input" class="modal__label">
            Image link
            <input
              type="url"
              class="modal__input"
              id="image-link-input"
              placeholder="Paste a link to the picture"
              required
            />
            <span id="image-link-input-error" class="modal__error"></span>
          </label>

          <label for="post-caption-input" class="modal__label">
            Caption
            <input
              type="text"
              class="modal__input"
              id="post-caption-input"
              placeholder="Type your caption"
              required
              maxlength="30"
              minlength="2"
            />
            <span id="post-caption-input-error" class="modal__error"></span>
          </label>

          <button class="modal__submit-btn" type="submit">Save</button>
        </form>
      </div>
    </div>
    <!-- PREVIEW SECTION -->
    <div class="modal" id="preview-post-modal">
        <div class="modal__preview-container">
          <img src="#" alt="#" class="modal__image">
          <p class="modal__preview-caption"></p>
          <button type="button" class="modal__close-btn modal__close-btn_type_preview" aria-label="Close"></button>
        </div>
    </div>
  </div>

  <!-- Edit Profile Modal -->
  <div class="modal" id="edit-avatar-modal">
      <div class="modal__container">
        <div class="modal__header">
          <h2 class="modal__title">Edit Avatar</h2>
          <button type="button"
          class="modal__close-btn"
          aria-label="Close"></button>
        </div>

        <form class="modal__form" id="edit-avatar-form" novalidate>
          <label for="profile-avatar-input" class="modal__label">
            Avatar
            <input
              type="url"
              class="modal__input"
              id="profile-avatar-input"
              placeholder="Paste image URL"
              required
              title="Enter a valid image URL"
              name="avatar"
            />
            <span id="profile-avatar-input-error" class="modal__error"></span>

          </label>
          <button class="modal__submit-btn" type="submit">Save</button>
        </form>
      </div>
    </div>

      <!-- delete card -->
  <div class="modal " id="edit-delete-modal">
      <div class="modal__container cancel-delete">
        <div class="modal__delete-container">
        <div class="modal__header">

          <h2 class="modal__title" id="delete__title">Are you sure you want to delete this image?</h2>
              <button type="button"
          class="modal__close-btn delete-close-btn"
          aria-label="Close"></button>
        </div>


        <form class="modal__form" id="delete-form" novalidate>

          <button class="modal__submit-btn modal__submit-btn--red" type="submit">Delete</button>
          <button class="modal__submit-btn  modal__submit-btn-cancel modal__submit-btn--white" type="button">Cancel</button>
        </form>
      </div>

    </div>
     </div>

</body>
</html>
